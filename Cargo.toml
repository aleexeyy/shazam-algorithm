[package]
name = "shazam"
version = "0.1.0"
edition = "2024"

[lib]
name = "shazam"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "shazam-server"
path = "src/bin/server.rs"

[dependencies]
actix-cors = "0.7"
actix-multipart = "0.7"
actix-web = "4"
bytes = "1"
base64 = "0.22"
dotenvy = "0.15"
futures-util = "0.3"
hound = "3.4.0"
rubato = "0.14"
rustfft = "5.1.0"
mime = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
mysql = "24.0.0"
log = "0.4"
env_logger = "0.9"
rayon = "1.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process"] }
uuid = { version = "1", features = ["v4"] }
