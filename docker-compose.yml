services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shazam}
      POSTGRES_USER: ${POSTGRES_USER:-shazam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shazam}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      SERVER_PORT: ${SERVER_PORT:-8000}
      DATABASE_URL: postgres://${POSTGRES_USER:-shazam}:${POSTGRES_PASSWORD:-shazam}@postgres:5432/${POSTGRES_DB:-shazam}
      CLIENT_ID: ${CLIENT_ID:-dummy}
      CLIENT_SECRET: ${CLIENT_SECRET:-dummy}
      RUST_LOG: ${RUST_LOG:-info}
      FRONTEND_DIST: ${FRONTEND_DIST:-/opt/shazam/frontend/dist}
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata: